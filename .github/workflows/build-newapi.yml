# 构建云梦定制版 new-api 镜像
#
# 做法:克隆上游锁定的 commit → 打 deploy/newapi/yunmeng.patch → 构建 → 推 GHCR。
# 不在本仓库存放 new-api 源码,只存 7.6KB 的补丁,改了什么一目了然。
#
# 触发:补丁或本文件变动时自动跑,也可在 Actions 页手动点。

name: build-newapi

on:
  push:
    branches: [main]
    paths:
      - 'deploy/newapi/**'
      - '.github/workflows/build-newapi.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yunmengapi-newapi

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 取本仓库(拿补丁)
        uses: actions/checkout@v4

      - name: 读上游锚点
        id: base
        run: echo "commit=$(cat deploy/newapi/base-commit)" >> "$GITHUB_OUTPUT"

      - name: 克隆上游 new-api
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/QuantumNous/new-api.git upstream
          cd upstream
          git checkout '${{ steps.base.outputs.commit }}'

      - name: 打补丁
        run: |
          cd upstream
          git apply --check -v ../deploy/newapi/yunmeng.patch
          git apply ../deploy/newapi/yunmeng.patch
          echo "VERSION = $(cat VERSION)"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送(服务器是 amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出拉取命令
        run: |
          echo "### 镜像已构建 :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
