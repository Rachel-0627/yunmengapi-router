# 构建云梦定制版 new-api 镜像
#
# 做法:克隆上游锁定的 commit → 打 deploy/newapi/yunmeng.patch → 构建 → 推 GHCR。
# 不在本仓库存放 new-api 源码,只存 7.6KB 的补丁,改了什么一目了然。
#
# 触发:补丁或本文件变动时自动跑,也可在 Actions 页手动点。

name: build-newapi

on:
  push:
    branches: [main]
    paths:
      - 'deploy/newapi/**'
      - '.github/workflows/build-newapi.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 取本仓库(拿补丁)
        uses: actions/checkout@v4

      - name: 读上游锚点
        id: base
        run: echo "commit=$(cat deploy/newapi/base-commit)" >> "$GITHUB_OUTPUT"

      - name: 算镜像名(GHCR 要求全小写)
        id: img
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/yunmengapi-newapi" >> "$GITHUB_OUTPUT"

      - name: 克隆上游 new-api
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/QuantumNous/new-api.git upstream
          cd upstream
          git checkout '${{ steps.base.outputs.commit }}'

      - name: 打补丁
        run: |
          cd upstream
          git apply --check -v ../deploy/newapi/yunmeng.patch
          git apply ../deploy/newapi/yunmeng.patch
          echo "VERSION = $(cat VERSION)"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送(服务器是 amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试(不通过就不算成功)
        run: |
          IMG='${{ steps.img.outputs.name }}:${{ github.sha }}'

          echo "── ① 补丁内容是否真的编进了二进制 ──"
          # go:embed 不压缩,前端产物以原文存在二进制里,可直接 grep。
          # 用 ASCII 串判定,避免 Vite 把中文转义成 \uXXXX 造成误报。
          fail=0
          for s in 'v1.0.0-rc.25-persecond' 'Per Second'; do
            if docker run --rm --entrypoint sh "$IMG" -c "grep -qa '$s' /new-api"; then
              echo "  ✓ $s"
            else
              echo "  ✗ 缺失:$s"; fail=1
            fi
          done
          # 中文两种形态都试,任一命中即可
          if docker run --rm --entrypoint sh "$IMG" -c \
               "grep -qa '点此购买兑换券' /new-api || grep -qa '\\u70b9\\u6b64\\u8d2d\\u4e70\\u5151\\u6362\\u5238' /new-api"; then
            echo "  ✓ 点此购买兑换券"
          else
            echo "  ✗ 缺失:点此购买兑换券"; fail=1
          fi
          [ "$fail" = 0 ] || exit 1

          echo "── ② 容器能不能正常起来 ──"
          docker run -d --name smoke -p 3000:3000 "$IMG"
          ok=0
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/status >/dev/null 2>&1; then
              ok=1; echo "  ✓ 约 $((i*3)) 秒内就绪"; break
            fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo "  ✗ 启动超时,日志末尾:"; docker logs smoke 2>&1 | tail -40; exit 1
          fi

          echo "── ③ 服务自报的版本 ──"
          curl -s http://localhost:3000/api/status \
            | python3 -c "import json,sys;print('  version =',json.load(sys.stdin)['data'].get('version'))"
          docker rm -f smoke >/dev/null

      - name: 输出拉取命令
        run: |
          echo "### 镜像已构建 :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.img.outputs.name }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
